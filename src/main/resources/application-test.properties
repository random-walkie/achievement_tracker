# Test Environment Configuration - using PostgreSQL for better prod-like testing

# Use container name or network alias instead of localhost
spring.datasource.url=jdbc:postgresql://localhost:5433/achievement_tracker_test
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
dotenv.paths=.env,.env.local
dotenv.load-all=true
dotenv.system-properties=true
spring.datasource.driver-class-name=org.postgresql.Driver

# Make sure these values are explicitly set
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.devtools.add-properties=false

# Logging settings for tests
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.com.example.achievement_tracker=DEBUG

# Disable web resources and thymeleaf cache for tests
spring.thymeleaf.cache=false

# Backblaze B2 Configuration
backblaze.b2.application-key-id=${TEST_B2_APPLICATION_KEY_ID}
backblaze.b2.application-key=${TEST_B2_APPLICATION_KEY}
backblaze.b2.bucket-name=${TEST_B2_BUCKET_NAME}
backblaze.b2.user-agent=AchievementTracker-Test/1.0.0
backblaze.b2.master-url=${TEST_B2_MASTER_URL}